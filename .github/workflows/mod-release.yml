name: Mod release

# 앱은 그대로 두고 게임 모드만 새로 낼 때: 모드를 빌드해서 최신 릴리스의 모드 파일을 바꾼다.
# 게임 안 자동 업데이트와 앱의 '모드 설치' 는 최신 릴리스의 SkyblockHelper-mod-버전.jar 를 받아 간다.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "릴리스 설명 끝에 덧붙일 모드 변경 내역 (마크다운)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  mod-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: cd mod && ./gradlew build --no-daemon -q && ls -la build/libs
      - name: Replace mod in the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          jar=$(ls mod/build/libs/SkyblockHelper-mod-*.jar | grep -v sources | head -1)
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "release $tag ← $(basename "$jar")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep '^SkyblockHelper-mod-.*\.jar$' | while read -r old; do
            [ "$old" = "$(basename "$jar")" ] || gh release delete-asset "$tag" "$old" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload "$tag" "$jar" --repo "$GITHUB_REPOSITORY" --clobber
          if [ -n "$NOTES" ]; then
            body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            printf '%s\n\n%s\n' "$body" "$NOTES" > notes.md
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
