name: Android update test

# 휴대폰 앱 안 업데이트를 에뮬레이터에서 끝까지 확인 (권한 허용 → 설치 확인 → 버전 확인, 두 번째 업데이트)
on:
  workflow_dispatch:
  push:
    branches: ["claude/skyblock-helper"]
    paths: ["androidApp/**", "tools/android_update_test.py", ".github/workflows/android-update-test.yml"]

concurrency:
  group: android-update-test
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test APKs (a = 지금 버전, b = 99.0.0, c = 99.0.1, 같은 서명 키)
        shell: bash
        env:
          ANDROID_SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        run: |
          set -o pipefail
          pip install -q cryptography
          python tools/android_key.py androidApp/release.jks sbhelper
          export ANDROID_KEYSTORE_FILE=release.jks ANDROID_KEYSTORE_PASSWORD=sbhelper ANDROID_KEY_ALIAS=sbh ANDROID_KEY_PASSWORD=sbhelper
          V=$(grep appVersion gradle.properties | cut -d= -f2)
          mkdir -p apks
          for spec in "$V:a" "99.0.0:b" "99.0.1:c"; do
            ver=${spec%%:*}; n=${spec##*:}
            ./gradlew :androidApp:assembleRelease -PappVersion=$ver -PselfTest=true 2>&1 | tail -3
            cp androidApp/build/outputs/apk/release/*.apk apks/$n.apk
          done
          ls -la apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android_update_test.py apks out
      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f out/result.txt ]; then
            while IFS= read -r line; do echo "::notice title=Android update test::${line//%/%25}"; done < out/result.txt
          else
            echo "::warning title=Android update test::결과 파일 없음"
          fi
          # 스크린샷·로그는 ci-android-test 브랜치로 (빌드 기록에서 바로 받아 보기)
          if [ -d out ]; then
            cd out
            git init -q && git checkout -q -b ci-android-test
            git config user.name "github-actions" && git config user.email "actions@github.com"
            git add . && git commit -q -m "android update test ${GITHUB_SHA::7}"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-android-test
          fi
