name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "릴리스 버전 (예: 1.1.0). 비워 두면 빌드만 해요."
        required: false
        default: ""
      notes:
        description: "업데이트 내역 (한국어, 앱의 새 버전 창에도 보여요)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # 테스트 + Android APK (Ubuntu 러너에는 Android SDK 가 설치되어 있음)
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then echo "v=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT";
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else grep appVersion gradle.properties | cut -d= -f2 | sed 's/^/v=/' >> "$GITHUB_OUTPUT"; fi
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:desktopTest :ui:compileKotlinDesktop :desktopApp:compileKotlin 2>&1 | tee gradle-test.log
      - name: Live check (실제 Hypixel·Mojang·위키 접속, 실패해도 빌드는 계속)
        continue-on-error: true
        env:
          LIVE_API: "1"
        shell: bash
        run: |
          ./gradlew :core:desktopTest --tests '*LiveApiTest*' --rerun -i > live.log 2>&1 || {
            echo "::warning title=Live check::$(grep -E 'LIVE OK|FAILED|Exception' live.log | head -5 | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Live check::$(grep 'LIVE OK' live.log | head -1)"
      - name: Unofficial sources check (EliteBot, Google 번역 응답 형식)
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          curl -sS --max-time 20 -o elite.json https://api.elitebot.dev/contests/at/now
          e=$(head -c 400 elite.json | tr '\n' ' ')
          echo "::notice title=EliteBot::${e//%/%25}"
          curl -sS --max-time 20 -o tr1.json "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=Hello%20world%0AGood%20bye"
          g=$(head -c 300 tr1.json | tr '\n' ' ')
          echo "::notice title=GoogleTranslate::${g//%/%25}"
          curl -sS --max-time 20 -o tr2.json "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=ko&q=Hello%20world"
          c=$(head -c 300 tr2.json | tr '\n' ' ')
          echo "::notice title=GoogleTranslate backup::${c//%/%25}"
          exit 0
      - name: Screenshots (화면 미리보기 → ci-screenshots 브랜치)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :desktopApp:screenshots 2>&1 | tee gradle-shots.log | tail -15
          cd desktopApp/build/screenshots
          git init -q && git checkout -q -b ci-screenshots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Android APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        run: |
          set -o pipefail
          if [ -n "$ANDROID_SIGNING_SEED" ]; then
            # 비밀 문구 하나로 항상 같은 키를 만든다 → 휴대폰에서 기존 앱 위에 바로 업데이트
            pip install -q cryptography
            python tools/android_key.py androidApp/release.jks sbhelper
            export ANDROID_KEYSTORE_PASSWORD=sbhelper ANDROID_KEY_ALIAS=sbh ANDROID_KEY_PASSWORD=sbhelper
          elif [ -n "$KEYSTORE_B64" ]; then
            # 저장소 비밀값의 고정 키 → 휴대폰에서 업데이트 설치가 그대로 됨
            echo "$KEYSTORE_B64" | base64 -d > androidApp/release.jks
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" ANDROID_KEY_ALIAS="$KEY_ALIAS" ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          else
            # 비밀값이 없으면 임시 키 (새 버전을 설치하려면 기존 앱을 지워야 할 수 있음)
            echo "::warning title=Android signing::ANDROID_SIGNING_SEED 비밀값이 없어서 임시 키로 서명했어요. 휴대폰 앱 업데이트가 설치되지 않을 수 있어요."
            keytool -genkeypair -keystore androidApp/release.jks -alias sbh -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=SkyblockHelper"
            export ANDROID_KEYSTORE_PASSWORD=android ANDROID_KEY_ALIAS=sbh ANDROID_KEY_PASSWORD=android
          fi
          export ANDROID_KEYSTORE_FILE=release.jks
          ./gradlew :androidApp:assembleRelease -PappVersion=${{ steps.ver.outputs.v }} 2>&1 | tee gradle-android.log
          mkdir -p out && cp androidApp/build/outputs/apk/release/*.apk out/SkyblockHelper-${{ steps.ver.outputs.v }}.apk
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          # 오류 줄만 모아 하나의 주석(annotation)으로 남긴다 (로그를 내려받지 않고 API 로 확인 가능)
          msg=$(grep -hE -A6 "^e: |What went wrong|FAILED|AssertionError|expected:|Error|error:" gradle-*.log 2>/dev/null \
            | grep -vE "^> Task|^--$" | head -80 || true)
          if [ -z "$msg" ]; then msg=$(tail -n 40 gradle-*.log 2>/dev/null || echo "no log"); fi
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
          echo "::error title=Build errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests

  # Windows 설치 파일 (.exe)
  windows:
    runs-on: windows-latest
    env:
      SBH_ANDROID: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then echo "v=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT";
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else grep appVersion gradle.properties | cut -d= -f2 | sed 's/^/v=/' >> "$GITHUB_OUTPUT"; fi
      - name: Package (Inno Setup 설치 프로그램)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :desktopApp:createDistributable "-PappVersion=${{ steps.ver.outputs.v }}" 2>&1 | tee gradle-windows.log
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*" "$ISCC" "/DMyAppVersion=${{ steps.ver.outputs.v }}" desktopApp/installer/SkyblockHelper.iss 2>&1 | tee -a gradle-windows.log
          # 설치 없이 쓰는 압축판
          (cd desktopApp/build/compose/binaries/main/app && 7z a -tzip "../../../../installer/SkyblockHelper-${{ steps.ver.outputs.v }}-portable.zip" SkyblockHelper > /dev/null)
          # 앱 안 업데이트 파일 (바뀐 jar 만 받아 다시 시작하면 적용)
          python tools/make_patch.py desktopApp/build/compose/binaries/main/app/SkyblockHelper "${{ steps.ver.outputs.v }}" desktopApp/build/installer
          ls -la desktopApp/build/installer
      - name: In-app update smoke test
        continue-on-error: true
        shell: bash
        run: |
          # 1) 그냥 실행  2) 앱 안 업데이트(받아 둔 jar)로 실행 — 둘 다 창이 뜨고 버전을 써야 한다
          DIST=desktopApp/build/compose/binaries/main/app/SkyblockHelper
          EXE="$DIST/SkyblockHelper.exe"
          timeout 180 "$EXE" "--smoke-test=$(cygpath -w "$PWD/smoke1.txt")" || true
          PATCH="$(cygpath -u "$APPDATA")/SkyblockHelper/patch"
          rm -rf "$PATCH" && mkdir -p "$PATCH/jars"
          python - "$DIST" "$PATCH" <<'PY'
          import json, os, shutil, sys
          dist, patch = sys.argv[1], sys.argv[2]
          m = json.load(open("desktopApp/build/installer/update-manifest.json"))
          lines = ["99.0.0"]
          for j in m["jars"]:
              if j["pack"] == "app":
                  name = j["sha256"][:16] + "-" + j["name"]
                  shutil.copy(os.path.join(dist, "app", j["name"]), os.path.join(patch, "jars", name))
                  lines.append("store:" + name)
              else:
                  lines.append("app:" + j["name"])
          open(os.path.join(patch, "current.txt"), "w").write("\n".join(lines))
          PY
          timeout 180 "$EXE" "--smoke-test=$(cygpath -w "$PWD/smoke2.txt")" || true
          r1=$(cat smoke1.txt 2>/dev/null || echo "실행 안 됨"); r2=$(cat smoke2.txt 2>/dev/null || echo "실행 안 됨")
          cat "$PATCH/broken.txt" 2>/dev/null || true
          rm -rf "$PATCH"
          echo "::notice title=Smoke test::normal: $r1 / in-app update: $r2"
          echo "$r2" | grep -q "patch=99.0.0"
      - name: Real update tests (설치본으로 앱 안 업데이트 · 설치 파일 업그레이드)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*"
          V="${{ steps.ver.outputs.v }}"
          NEW="desktopApp/build/installer/SkyblockHelper-$V.exe"
          INSTU="$(cygpath -u "$LOCALAPPDATA")/Programs/SkyblockHelper"
          INSTW="$(cygpath -w "$INSTU")"
          PATCH="$(cygpath -u "$APPDATA")/SkyblockHelper/patch"
          stage() {  # $1 = 가짜 버전, $2 = 네이티브도 바뀐 것처럼(1/0), $3 = 설치본 Boot 기능
            rm -rf "$PATCH" up; mkdir -p up
            cp desktopApp/build/installer/update-manifest.json desktopApp/build/installer/*-patch-*.zip up/
            python - "$1" "$2" <<'PY'
          import json, os, glob, sys
          m = json.load(open("up/update-manifest.json")); old = m["version"]
          m["version"] = sys.argv[1]
          if sys.argv[2] == "1": m["nativeHash"] = "0" * 64
          json.dump(m, open("up/update-manifest.json", "w"))
          for f in glob.glob("up/*-patch-*.zip"): os.rename(f, f.replace("-" + old + "-", "-" + sys.argv[1] + "-"))
          PY
            ./gradlew -q :desktopApp:updaterSelfTest "-PselfTestArgs=$INSTW\app;$(cygpath -w "$PWD/up");$(cygpath -w "$PWD/selftest.txt");$3"
          }
          smoke() { rm -f "$1"; timeout 180 "$INSTU/SkyblockHelper.exe" "--smoke-test=$(cygpath -w "$PWD/$1")"; cat "$1" 2>/dev/null || echo "실행 안 됨"; }
          # ---- 테스트 1: v1.4.1 설치본 → 이번 빌드를 앱 안 업데이트로 (jar 만)
          curl -sfL -o old141.exe https://github.com/pkgw07/SkyblockHelper/releases/download/v1.4.1/SkyblockHelper-1.4.1.exe
          ./old141.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART; sleep 10; taskkill /F /IM SkyblockHelper.exe >/dev/null 2>&1; sleep 2
          stage 99.0.0 0 ""; r0=$(cat selftest.txt); r1=$(smoke t1.txt)
          echo "::notice title=Update test 1 (1.4.1 설치본, 앱 안 업데이트)::$r0 → 실행: $r1"
          # ---- 테스트 2: 1.3.0 을 켜 둔 채로, 예전 앱처럼 새 설치 파일을 조용히 실행 (앱은 일부러 안 끔)
          rm -rf "$PATCH"
          curl -sfL -o old130.exe https://github.com/pkgw07/SkyblockHelper/releases/download/v1.3.0/SkyblockHelper-1.3.0.exe
          ./old130.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART; sleep 5; taskkill /F /IM SkyblockHelper.exe >/dev/null 2>&1; sleep 2
          # 1.3.0 이 켜지자마자 스스로 업데이트하지 않게 자동 업데이트를 꺼 두고 띄운다 (켜져 있는 앱 위에 설치하는 상황 재현)
          DATA="$(cygpath -u "$APPDATA")/SkyblockHelper"; mkdir -p "$DATA"
          echo '{"device":{"autoUpdate":false,"onboardingDone":true}}' > "$DATA/state.json"
          "$INSTU/SkyblockHelper.exe" & sleep 25
          running=$(tasklist | grep -ci skyblockhelper)
          "$NEW" /SILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS "/LOG=$(cygpath -w "$PWD/up130.log")"; rc=$?
          rollback=$(grep -ci "rolling back\|rollback" up130.log)
          sleep 15; relaunched=$(tasklist | grep -ci skyblockhelper); taskkill /F /IM SkyblockHelper.exe >/dev/null 2>&1; sleep 2
          r2=$(smoke t2.txt)
          echo "::notice title=Update test 2 (켜져 있는 1.3.0 위에 설치)::실행 중이던 앱 ${running}개, 설치 rc=$rc, 롤백 ${rollback}회, 설치 후 자동 재실행 ${relaunched}개, 실행: $r2"
          lt=$(grep -iE "PrepareToInstall|taskkill|Rolling|error|Exit code|Need to restart" up130.log | tail -n 15 | tr '\r\n' '  |' | sed 's/%/%25/g'); echo "::notice title=Installer log::$lt"
          # ---- 테스트 3: 이번 설치본 → 네이티브 파일까지 바뀐 업데이트를 앱 안에서
          stage 99.0.1 1 native; r3s=$(cat selftest.txt); r3=$(smoke t3.txt)
          echo "::notice title=Update test 3 (네이티브 파일 교체)::$r3s → 실행: $r3"
          rm -rf "$PATCH"
          # ---- 테스트 4: 앱의 '삭제' 기능 (설정·기록까지) → 설치 폴더·데이터 폴더·제거 목록이 없어지는지
          mkdir -p "$DATA"; echo '{"device":{"onboardingDone":true}}' > "$DATA/state.json"
          "$INSTU/SkyblockHelper.exe" --uninstall-test & 
          gone=0; for i in $(seq 1 40); do sleep 3; if [ ! -e "$INSTU/SkyblockHelper.exe" ] && [ ! -d "$DATA" ]; then gone=1; break; fi; done
          leftApp=$([ -e "$INSTU/SkyblockHelper.exe" ] && echo "남음" || echo "지워짐")
          leftDir=$([ -d "$INSTU" ] && echo "폴더 남음($(ls "$INSTU" 2>/dev/null | head -5 | tr '\n' ' '))" || echo "폴더 없음")
          leftData=$([ -d "$DATA" ] && echo "남음" || echo "지워짐")
          reg=$(reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall" /s /f SkyblockHelper 2>/dev/null | grep -ci "DisplayName")
          echo "::notice title=Uninstall test (앱의 삭제 버튼)::실행 파일 $leftApp, $leftDir, 설정·기록 $leftData, 제거 목록 항목 ${reg}개, $((i*3))초"
          echo "$r1" | grep -q "patch=99.0.0" && echo "$r2" | grep -q "^$V patch=none" && echo "$r3" | grep -q "patch=99.0.1" && [ "$gone" = 1 ]
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          # 오류 줄만 모아 하나의 주석(annotation)으로 남긴다 (로그를 내려받지 않고 API 로 확인 가능)
          msg=$(grep -hE -A6 "^e: |What went wrong|FAILED|AssertionError|expected:|Error|error:" gradle-*.log 2>/dev/null \
            | grep -vE "^> Task|^--$" | head -80 || true)
          if [ -z "$msg" ]; then msg=$(tail -n 40 gradle-*.log 2>/dev/null || echo "no log"); fi
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
          echo "::error title=Build errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktopApp/build/installer/*.exe
            desktopApp/build/installer/*.zip
            desktopApp/build/installer/*.json

  # 태그(v1.0.0 등)를 올리거나, Actions 에서 release_version 을 넣고 실행하면 GitHub Releases 에 설치 파일을 올린다
  # Minecraft 26.2 게임 모드 (릴리스에 같이 올림)
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        shell: bash
        run: cd mod && ./gradlew build --no-daemon -q && ls -la build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod
          path: |
            mod/build/libs/SkyblockHelper-mod-*.jar
            !mod/build/libs/*-sources.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: [test-android, windows, mod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
          name: SkyblockHelper ${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # 사람이 받는 파일만: 설치 파일, 압축판, 휴대폰 APK, 게임 모드
          files: |
            dist/windows-installer/*.exe
            dist/windows-installer/*-portable.zip
            dist/android-apk/*.apk
            dist/minecraft-mod/*.jar
          # 업데이트 내역은 직접 쓴 한국어 글 (자동 커밋 목록은 쓰지 않음)
          body: ${{ inputs.notes }}
          generate_release_notes: false
      # 앱 안 업데이트 파일(바뀐 부분만 받기)은 릴리스 대신 updates 브랜치에 (최신 버전 것만)
      - name: Publish in-app update files
        shell: bash
        run: |
          mkdir upd
          cp dist/windows-installer/update-manifest.json dist/windows-installer/*-patch-*.zip upd/
          cd upd
          git init -q && git checkout -q -b updates
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "in-app update files ${{ inputs.release_version }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" updates
