name: Mod

# Minecraft 26.2 Fabric 모드 빌드 (mod/ 폴더, 자바 25)
on:
  workflow_dispatch:
    inputs:
      api_dump:
        description: "javap 로 게임 클래스 목록 출력 (개발용)"
        type: string
        default: ""
      code_grep:
        description: "javap -c 결과에서 찾을 정규식 (개발용, 비우면 안 함)"
        type: string
        default: ""
  push:
    branches: ["claude/skyblock-helper"]
    paths: ["mod/**", ".github/workflows/mod.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          cd mod
          ./gradlew build --no-daemon 2>&1 | tee ../mod-build.log
          ls -la build/libs
      - name: API dump
        if: inputs.api_dump != ''
        shell: bash
        run: |
          jar=$(find ~/.gradle mod/.gradle -name 'minecraft-*.jar' -size +5M 2>/dev/null | grep -iv sources | head -5)
          fab=$(find ~/.gradle/caches -path '*fabric*' -name '*.jar' 2>/dev/null | grep -iv sources | tr '\n' ':')
          cp="$(echo "$jar" | tr '\n' ':')$fab"
          for c in ${{ inputs.api_dump }}; do
            echo "=== $c"
            if [ -n "${{ inputs.code_grep }}" ]; then
              javap -c -p -cp "$cp" "$c" 2>&1 | grep -E "^  [a-z].*\(|${{ inputs.code_grep }}" || true
            else
              javap -p -cp "$cp" "$c" 2>&1 | grep -v lambda || true
            fi
          done > api-dump.txt
          if [ -n "${{ inputs.code_grep }}" ]; then
            echo "=== jar entries"
            for j in $(echo "$cp" | tr ':' ' '); do unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E "${{ inputs.code_grep }}" | head -40; done >> api-dump.txt
          fi
          cat api-dump.txt
      - uses: actions/upload-artifact@v4
        if: inputs.api_dump != ''
        with:
          name: api-dump
          path: api-dump.txt
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          msg=$(grep -hE -A3 "error:|What went wrong|FAILED|Could not" mod-build.log | head -120 || true)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
          echo "::error title=Mod build errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: skyblockhelper-mod
          path: mod/build/libs/SkyblockHelper-mod-*.jar
