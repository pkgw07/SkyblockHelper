name: Mod

# Minecraft 26.2 Fabric 모드 빌드 (mod/ 폴더, 자바 25)
on:
  workflow_dispatch:
  push:
    branches: ["claude/skyblock-helper"]
    paths: ["mod/**", ".github/workflows/mod.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          cd mod
          ./gradlew build --no-daemon 2>&1 | tee ../mod-build.log
          ls -la build/libs
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          msg=$(grep -hE -A3 "error:|What went wrong|FAILED|Could not" mod-build.log | head -120 || true)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"; msg="${msg//$'\r'/}"
          echo "::error title=Mod build errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: skyblockhelper-mod
          path: mod/build/libs/SkyblockHelper-mod-*.jar
