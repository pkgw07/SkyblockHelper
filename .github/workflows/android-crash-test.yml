name: Android crash test

# 실제 계정을 연결한 휴대폰 앱을 에뮬레이터에서 켜고 모든 화면을 열어 본다. 앱이 꺼지면 오류 기록을 남긴다.
on:
  workflow_dispatch:
    inputs:
      player:
        description: "연결할 닉네임"
        required: true
        default: "dragon0709"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app (self-test)
        shell: bash
        env:
          ANDROID_SIGNING_SEED: ${{ secrets.ANDROID_SIGNING_SEED }}
        run: |
          pip install -q cryptography
          python tools/android_key.py androidApp/release.jks sbhelper
          export ANDROID_KEYSTORE_FILE=release.jks ANDROID_KEYSTORE_PASSWORD=sbhelper ANDROID_KEY_ALIAS=sbh ANDROID_KEY_PASSWORD=sbhelper
          ./gradlew :androidApp:assembleRelease -PselfTest=true 2>&1 | tail -3
          cp androidApp/build/outputs/apk/release/*.apk app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app with a real account
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SB_KEY: ${{ secrets.HYPIXEL_API_KEY }}
          SB_USER: ${{ inputs.player }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_crash_test.sh
      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -f crash.txt ]; then
            while IFS= read -r line; do echo "::notice title=Crash test::${line//%/%25}"; done < crash.txt
          else echo "::warning title=Crash test::결과 없음"; fi
